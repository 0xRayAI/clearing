name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # npm 9 cannot npm ci this lockfile (vendored 0xray). Node 20.0–20.9 ships npm 9.
      - name: Require npm 10+
        run: npm install -g npm@10
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  escrow:
    name: escrow (cargo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: near/escrow
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # near-workspaces talks to the sandbox over reqwest's native-tls.
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo test --locked
      - run: cargo build --locked --release --target wasm32-unknown-unknown
      - run: ls -l target/wasm32-unknown-unknown/release/*.wasm
