[package]
name = "clearing-escrow"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Testnet USDC escrow. Release after the client accepts the work."

[dependencies]
near-sdk = "=5.7.0"

[dev-dependencies]
near-sdk = { version = "=5.7.0", features = ["unit-testing"] }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
