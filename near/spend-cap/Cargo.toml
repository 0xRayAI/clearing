[package]
name = "clearing-spend-cap"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "USDC spend vault. A per-payment cap and a budget window, paid by the vault."

[dependencies]
near-sdk = "=5.7.0"

[dev-dependencies]
near-sdk = { version = "=5.7.0", features = ["unit-testing"] }
near-workspaces = { version = "0.24", default-features = false, features = ["install", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
# Test-only. `cargo build --release` does not enable it. Sandbox cannot create
# the Circle implicit account, so the sandbox binary accepts the token it deploys.
sandbox-token = []

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
